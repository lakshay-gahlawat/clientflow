# Production compose file. Differences from the dev docker-compose.yml:
#   - Dockerfile.prod images (no --reload, no bind-mounted source)
#   - no source volume mounts — images are immutable, rebuilt per deploy
#   - restart: unless-stopped on every long-running service
#   - all secrets/config come from the environment, never baked into
#     the compose file itself (see .env.example)
#   - frontend served by nginx on port 80, not the Vite dev server
#
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# Requires a real .env file (see backend/.env.example) — never commit it.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # In a real deployment, front this with a managed Redis (or at
    # minimum enable requirepass + TLS) — the bare image here has no
    # auth configured, appropriate for a docker-compose-internal network
    # but not for anything with a publicly reachable Redis port.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    env_file: .env
    depends_on:
      - backend
      - redis

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
