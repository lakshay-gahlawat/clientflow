server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any path not matching a real static file falls back
    # to index.html so React Router handles it client-side. Without
    # this, refreshing on e.g. /leads/abc-123 would 404 at the server.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite (index-<hash>.js) — safe
    # to cache aggressively. index.html itself is NOT cached this way
    # (falls through to nginx's default, effectively no long-lived
    # cache), which matters: it's the one file that must always be
    # fetched fresh to pick up new asset hashes after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
